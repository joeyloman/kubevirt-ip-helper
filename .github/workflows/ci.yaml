name: CI

on:
  push:
    branches:
      - main
      - devel/v1.0.x
      - release/v0.9.x
      - release/v1.0.x
  pull_request:
    branches:
      - main
      - devel/v1.0.x
      - release/v0.9.x
      - release/v1.0.x

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "the following files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Lint chart
        run: helm lint deployments/charts/kubevirt-ip-helper

      - name: Render chart
        run: helm template test deployments/charts/kubevirt-ip-helper > /dev/null
