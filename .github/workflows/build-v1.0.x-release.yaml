name: Build, tag, and push v1.0.x image to GHCR

on:
  push:
    branches:
      - release/v1.0.x

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-v1-0-x-latest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the container with the commit shasum, tag it as v1.0.x-latest and push them
        id: build-image
        run: |
          docker build -f build/Dockerfile -t $REGISTRY/$IMAGE_NAME:$(echo ${GITHUB_SHA:0:8}) .
          docker push $REGISTRY/$IMAGE_NAME:$(echo ${GITHUB_SHA:0:8})
          docker tag $REGISTRY/$IMAGE_NAME:$(echo ${GITHUB_SHA:0:8}) $REGISTRY/$IMAGE_NAME:v1.0.x-latest
          docker push $REGISTRY/$IMAGE_NAME:v1.0.x-latest
