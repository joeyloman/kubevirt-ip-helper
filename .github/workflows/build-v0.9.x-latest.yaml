name: Build, tag, and push v0.9.x image to GHCR

on:
  push:
    branches:
      - release/v0.9.x

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-v0-9-x-latest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the container with the commit shasum, tag it as v0.9.x-latest and push them
        id: build-image
        run: |
          docker build -t $REGISTRY/$IMAGE_NAME:$(echo ${GITHUB_SHA:0:8}) .
          docker push $REGISTRY/$IMAGE_NAME:$(echo ${GITHUB_SHA:0:8})
          docker tag $REGISTRY/$IMAGE_NAME:$(echo ${GITHUB_SHA:0:8}) $REGISTRY/$IMAGE_NAME:v0.9.x-latest
          docker push $REGISTRY/$IMAGE_NAME:v0.9.x-latest
