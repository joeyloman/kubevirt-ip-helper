kind: Namespace
apiVersion: v1
metadata:
  name: kubevirt-ip-helper
  labels:
    app: kubevirt-ip-helper
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubevirt-ip-helper
  namespace: kubevirt-ip-helper
  labels:
    app: kubevirt-ip-helper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubevirt-ip-helper
  labels:
    app: kubevirt-ip-helper
rules:
- apiGroups: ["kubevirtiphelper.k8s.binbash.org"]
  resources:
  - ippools
  - ippools/status
  - virtualmachinenetworkconfigs
  - virtualmachinenetworkconfigs/status
  verbs: ["get", "list", "watch", "create", "update", "delete"]
- apiGroups: ["kubevirt.io"]
  resources:
  - virtualmachines
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubevirt-ip-helper
  labels:
    app: kubevirt-ip-helper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubevirt-ip-helper
subjects:
- kind: ServiceAccount
  name: kubevirt-ip-helper
  namespace: kubevirt-ip-helper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubevirt-ip-helper
  namespace: kubevirt-ip-helper
  labels:
    app: kubevirt-ip-helper
rules:
- apiGroups: [""]
  resources:
  - pods
  verbs: ["get", "update"]
- apiGroups: ["coordination.k8s.io"]
  resources:
  - leases
  verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubevirt-ip-helper
  namespace: kubevirt-ip-helper
  labels:
    app: kubevirt-ip-helper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubevirt-ip-helper
subjects:
- kind: ServiceAccount
  name: kubevirt-ip-helper
  namespace: kubevirt-ip-helper
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kubevirt-ip-helper
  name: kubevirt-ip-helper
  namespace: kubevirt-ip-helper
spec:
  # the deadline must exceed the 15-minute startup-gate stall timeout of
  # the application, plus image pull time, or a legitimately slow startup
  # is marked ProgressDeadlineExceeded on first install
  progressDeadlineSeconds: 1800
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: kubevirt-ip-helper
  # the replicas are lease peers: the standby is a ready pod which serves
  # nothing (the readiness probe does not gate on the leadership - see the
  # services check of the application), so the deployment reaches its
  # desired availability and the rollout completes. maxUnavailable: 0 keeps
  # the serving leader in place until the replacement replicas are
  # available: the old pod is terminated last, its SIGTERM releases the
  # leader lease (ReleaseOnCancel + the signal handler) and the new leader
  # rebuilds its services from the still-live configuration
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{ "interface":"eth1","name":"<NETWORKATTACHMENTDEFINITION_NAME>","namespace":"<NAMESPACE>" }]'
      labels:
        app: kubevirt-ip-helper
    spec:
      containers:
      - name: kubevirt-ip-helper
        image: ghcr.io/joeyloman/kubevirt-ip-helper:latest
        env:
          - name: LOGLEVEL
            value: INFO
          - name: METRICS_PORT
            value: "8080"
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            add: 
              - NET_ADMIN
        # the liveness probe checks the leader-election freshness through
        # the /healthz endpoint: it fails only while this pod owns the
        # leader lease but could not renew it (or its process is wedged),
        # so the kubelet restarts a stale leader instead of leaving its
        # DHCP servers answering on the segment with a diverging allocator
        # the health server starts only inside Run, after Init and the
        # startup network cleanup: without a startup probe the liveness
        # probe below (15s initial delay, 3 failures) would kill a pod
        # whose startup legitimately exceeds ~45s - a slow apiserver -
        # before the process ever listens. the startup probe tolerates
        # the full startup budget (the 15-minute gate stall timeout of
        # the application) before the liveness probe arms.
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          failureThreshold: 90
        # the liveness probe checks the leader-election freshness through
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        # the readiness probe reports a pod whose service era is being built
        # (APP_INIT) or torn down (APP_RESTART) as not-ready. it must not
        # gate on the leadership: a non-leader replica would stay not-ready
        # forever, the deployment could never reach its desired
        # availability, and every rollout would be reported as failed at the
        # progress deadline although the leader serves. the metrics service
        # selects the serving pod through the pod label, not through this
        # endpoint
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      serviceAccountName: kubevirt-ip-helper
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: kubevirt-ip-helper
  name: kubevirt-ip-helper-metrics
  namespace: kubevirt-ip-helper
spec:
  selector:
    app: kubevirt-ip-helper
    kubevirtiphelper/leader: active
  ports:
    - name: metrics
      port: 8080
      protocol: TCP
      targetPort: 8080
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: kubevirt-ip-helper
  name: kubevirt-ip-helper
  namespace: kubevirt-ip-helper
spec:
  endpoints:
    - port: metrics
      scheme: http
  jobLabel: jobLabel
  selector:
    matchLabels:
      app: kubevirt-ip-helper