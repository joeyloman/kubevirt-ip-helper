apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubevirt-ip-helper.fullname" . }}
  namespace: {{ .Release.Namespace | default "kube-system" }}
  labels:
    {{- include "kubevirt-ip-helper.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.kubevirtiphelper.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubevirt-ip-helper.selectorLabels" . | nindent 6 }}
  # the replicas are lease peers: the startup gate of a replacement era can
  # take up to 15 minutes, so the rollout must not terminate the serving
  # leader in place and must wait for the replacement to converge
  progressDeadlineSeconds: 1800
  revisionHistoryLimit: 10
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      {{- with .Values.kubevirtiphelper.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kubevirt-ip-helper.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.kubevirtiphelper.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kubevirtiphelper.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kubevirtiphelper.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      dnsPolicy: ClusterFirst
      {{- with .Values.kubevirtiphelper.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kubevirt-ip-helper.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.kubevirtiphelper.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.kubevirtiphelper.securityContext | nindent 12 }}
          image: "{{ .Values.kubevirtiphelper.image.repository }}:{{ .Values.kubevirtiphelper.image.tag | default .Chart.AppVersion }}"
          {{- with .Values.kubevirtiphelper.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ .Values.kubevirtiphelper.image.pullPolicy }}
          # the health server listens on the metrics port: healthz reports
          # the leader-election freshness, ready reports a pod whose era is
          # being built (APP_INIT) or torn down (APP_RESTART) as not-ready
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.kubevirtiphelper.service.metricsPort | default 8080 }}
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.kubevirtiphelper.service.metricsPort | default 8080 }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.kubevirtiphelper.service.metricsPort | default 8080 }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.kubevirtiphelper.resources | nindent 12 }}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
