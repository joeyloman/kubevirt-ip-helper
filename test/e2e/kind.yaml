# Disposable kind cluster: one control-plane and two workers. bootstrap.sh
# connects all three nodes to the isolated shared test data networks.
#
# The node image is intentionally not set here: bootstrap.sh passes the
# digest-pinned ${KINDEST_NODE_IMAGE} from versions.env with
# `kind create --image`, so the pin lives in exactly one place.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  # Data-plane workloads use the normal worker scheduling policy. Test gateway
  # and DNS infrastructure live on the control-plane, outside worker faults.
  - role: control-plane
  - role: worker
  - role: worker
networking:
  # kindnet stays the delegate CNI. Multus is installed as the master plugin on
  # top of its config in /etc/cni/net.d, which is what the CNI preflight checks.
  disableDefaultCNI: false
  # Deliberately clear of the 10.77.0.0/24 IPPool used on the bridge network.
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
